<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join my 75 Hard</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #0a0a0b; color: #f5f5f7; font: 17px -apple-system, system-ui, sans-serif; }
  main { padding: 24px; max-width: 360px; }
  .mark { display: inline-grid; place-items: center; width: 52px; height: 44px; border-radius: 12px; background: #ff5a1f; color: #fff; font: italic 900 26px -apple-system, system-ui; }
  h1 { font: italic 900 44px/1 -apple-system, system-ui; margin: 24px 0 8px; letter-spacing: -0.5px; }
  p { color: #8c8c94; margin: 0 0 28px; }
  a { display: block; text-align: center; padding: 18px; border-radius: 16px; background: #ff5a1f; color: #fff; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<main>
  <div class="mark">75</div>
  <h1 id="t">Join my 75 Hard</h1>
  <p>Open this on your iPhone with the 75 Hard app installed from TestFlight.</p>
  <a id="open" href="#">Open in 75 Hard</a>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const name = q.get("n");
  if (name) document.getElementById("t").textContent = "Join " + name + "'s 75 Hard";
  const url = "seventyfive://add?" + q.toString();
  document.getElementById("open").href = url;
  if (q.get("c")) location.href = url;
</script>
</body>
</html>
